name: spendly
description: "Egypt Edu Gate - Expense management and educational operations system."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Backend
  supabase_flutter: ^2.9.0

  # Navigation
  go_router: ^15.1.2

  # Charts
  fl_chart: ^0.70.2

  # Environment
  flutter_dotenv: ^5.2.1

  # Dependency Injection
  get_it: ^8.0.3

  # Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.2
  connectivity_plus: ^6.1.3
  path: ^1.9.0
  path_provider: ^2.1.5

  # Local Persistence
  sqflite: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.3.4+4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
